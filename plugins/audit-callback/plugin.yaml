name: audit-callback
version: "0.5.0"
description: "Async batched execution-audit reporting to the platform Agent Execution Audit API (POST /api/v1/agent/audit). The worker collects up to 100 events and ships as IngestBatchRequest {items: [...]} so the wire stays cheap — per-item status:"duplicate" is the platform's idempotency dedup, status:"error" is logged. Reports shell commands (terminal) classified hardline/dangerous, ALL execute_code calls (high when code matches process-spawn/dynamic-exec indicators, else medium), ALL computer_use calls (medium), skill_view loads, write_file/patch (info, empty writes escalate to medium), and skill lifecycle mutations (skill_manage) as IngestSingleRequest-shaped records with event_type/risk_level/event_id/risk_reason/decision/result/exit_code/duration_ms/payload (CommandPayload|SkillPayload) at post_tool_call so the record carries post-execution signals (decision prefers the machine-readable status:'blocked'). actor is server-overridden from auth (sandbox id) — NOT sent by the client. username carries the real triggering user from the gateway session context (HERMES_SESSION_USER_NAME). actor_type=channel=agent are sent; env is sent when HERMES_AUDIT_ENV is set. Auth via CONTROL_PLANE_AUTH (sandbox JWT) or HERMES_AUDIT_TOKEN. Fire-and-forget: bounded queue + single daemon worker with transient retry. Reporting failure never blocks the agent loop. Intake URL: HERMES_AUDIT_CALLBACK_URL wins when set, else derives <CONTROL_PLANE_URL>/api/v1/agent/audit (same control-plane base as the whitelist fetch). No-op when both are unset. Warns once when the intake URL is plain http://. Set HERMES_AUDIT_REPORT_ALL_COMMANDS=1 to also report every terminal command at 'info' severity."
author: "wehermes"
hooks:
  - post_tool_call
