name: audit-callback
version: "0.2.0"
description: "Async execution-audit reporting to the platform Agent Execution Audit API (POST /api/v1/agent/audit). Reports shell commands (terminal) classified hardline/dangerous and skill lifecycle mutations (skill_manage) as IngestSingleRequest records — event_type/risk_level/event_id/CommandPayload|SkillPayload — at post_tool_call so the record carries exit_code/result/duration/decision. Auth via CONTROL_PLANE_AUTH (sandbox JWT) or HERMES_AUDIT_TOKEN. Fire-and-forget: bounded queue + single daemon worker with transient retry; platform dedups by event_id. Reporting failure never blocks the agent loop. No-op when HERMES_AUDIT_CALLBACK_URL is unset. Set HERMES_AUDIT_REPORT_ALL_COMMANDS=1 to also report every terminal command at 'info' severity."
author: "wehermes"
hooks:
  - post_tool_call
