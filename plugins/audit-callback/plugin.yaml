name: audit-callback
version: "0.3.1"
description: "Async execution-audit reporting to the platform Agent Execution Audit API (POST /api/v1/agent/audit). Reports shell commands (terminal) classified hardline/dangerous, ALL execute_code calls (high when code matches process-spawn/dynamic-exec indicators, else medium), ALL computer_use calls (medium), and skill lifecycle mutations (skill_manage) as IngestSingleRequest records — event_type/risk_level/event_id/CommandPayload|SkillPayload — at post_tool_call so the record carries exit_code/result/duration/decision (decision prefers the machine-readable status:'blocked'). Auth via CONTROL_PLANE_AUTH (sandbox JWT) or HERMES_AUDIT_TOKEN. Fire-and-forget: bounded queue + single daemon worker with transient retry; platform dedups by event_id. Reporting failure never blocks the agent loop. Intake URL: HERMES_AUDIT_CALLBACK_URL wins when set, else derives <CONTROL_PLANE_URL>/api/v1/agent/audit (same control-plane base as the whitelist fetch). No-op when both are unset. Warns once when the intake URL is plain http://. Set HERMES_AUDIT_REPORT_ALL_COMMANDS=1 to also report every terminal command at 'info' severity."
author: "wehermes"
hooks:
  - post_tool_call
