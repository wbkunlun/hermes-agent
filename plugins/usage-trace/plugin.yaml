name: usage-trace
version: "0.1.0"
description: >
  (fork, wehermes) Continuous agent trace flow to local JSONL. Appends one
  line per event to $HERMES_HOME/usage-traces/<session_id>.jsonl: api_request
  (canonical usage tokens, duration, model, finish_reason, MoA advisor costs),
  api_error, user_prompt (deduped per turn), assistant_response, tool_call
  (args/result per capture mode), approval (choice + command), session_end.
  Turns are linked via turn_id + api_request_id. Content capture modes via
  HERMES_USAGE_TRACE_CAPTURE=metadata|sanitized|full (default sanitized:
  redact_sensitive_text force=True then truncate; redactor failure degrades
  the field to metadata-only). Master switch HERMES_USAGE_TRACE=0 disables.
  Retention HERMES_USAGE_TRACE_RETENTION_DAYS (default 30) prunes old *.jsonl
  at writer start. Fire-and-forget: bounded queue (2000, drop-oldest) + single
  daemon writer thread; hook failures never propagate into the agent loop.
author: "wehermes"
hooks:
  - post_api_request
  - api_request_error
  - pre_llm_call
  - post_tool_call
  - post_approval_response
  - on_session_finalize
  - on_session_end
