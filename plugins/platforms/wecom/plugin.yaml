name: wecom-platform
label: WeCom (Enterprise WeChat)
kind: platform
version: 1.2.0
description: >
  WeCom / Enterprise WeChat gateway adapter for Hermes Agent. Registers the
  ``wecom`` platform (Smart Robot over WebSocket) and relays messages between
  WeCom chats and the Hermes agent. Also registers 16 business tools (docs /
  sheets / calendar / todo / mail / contacts / WeDrive via the official
  wecom-cli when installed and authorized; messaging via the gateway's own
  connection — the CLI message family would displace the bot's single live
  session). Fork 2026-10-10: the ``wecom_callback`` self-built-app platform
  and the WECOM_CALLBACK_* Bot→Agent fallback were removed (no fallback
  interface in this deployment family).
author: NousResearch
# The wecom-cli business client tools. Declaring them here asks discovery to
# import `tools.py` in CLI/TUI processes (same contract as the a2a plugin).
provides_tools:
  - wecom_cli_status
  - wecom_cli_schema
  - wecom_cli
  - wecom_doc_create
  - wecom_doc_read
  - wecom_doc_append
  - wecom_sheet_read
  - wecom_sheet_append
  - wecom_calendar_create
  - wecom_calendar_list
  - wecom_todo_create
  - wecom_todo_complete
  - wecom_mail_send
  - wecom_mail_search
  - wecom_contact_search
  - wecom_message_push
requires_env:
  - name: WECOM_BOT_ID
    description: "WeCom Smart Robot bot ID"
    prompt: "WeCom bot ID"
    password: false
  - name: WECOM_SECRET
    description: "WeCom Smart Robot secret"
    prompt: "WeCom secret"
    password: true
optional_env:
  - name: WECOM_WEBSOCKET_URL
    description: "WeCom Smart Robot WebSocket URL"
    prompt: "WeCom WebSocket URL"
    password: false
  - name: WECOM_HOME_CHANNEL
    description: "Default chat ID for cron / notification delivery"
    prompt: "Home channel ID"
    password: false
  - name: WECOM_ALLOWED_USERS
    description: "Comma-separated WeCom user IDs allowed to talk to the bot"
    prompt: "Allowed users (comma-separated)"
    password: false
  - name: WECOM_CLI_BIN
    description: "Path to the wecom-cli binary (default: wecom-cli on PATH)"
    prompt: "wecom-cli binary path"
    password: false
  - name: HERMES_WECOM_CLI_TIMEOUT
    description: "Per-call wecom-cli subprocess timeout in seconds (default 60)"
    prompt: "wecom-cli timeout seconds"
    password: false
  - name: HERMES_WECOM_GROUP_PENDING_TTL_SECONDS
    description: "TTL seconds for the group pending-redelivery queue (scheduled sends stashed until the group's next inbound message); 0 disables"
    prompt: "Group pending redelivery TTL seconds (default 21600)"
    password: false
  - name: HERMES_WECOM_GROUP_PENDING_MAX
    description: "Max stashed entries per group before the oldest is dropped"
    prompt: "Group pending queue cap (default 5)"
    password: false
